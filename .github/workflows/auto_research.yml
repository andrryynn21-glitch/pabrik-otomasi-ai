name: AI Daily Trend Research

on:
  schedule:
    # Berjalan otomatis setiap hari (06:00 WIB)
    - cron: '0 23 * * *' 
  workflow_dispatch: # Memungkinkan eksekusi manual kapan pun dari web GitHub

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run AI Research Script
        run: |
          python main.py
