name: AI Daily Trend Research

on:
  workflow_dispatch:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI Research Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET_NUMBER: ${{ secrets.WA_TARGET_NUMBER }}
        run: python main.py

      - name: Commit and Push Report File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add laporan_riset_*.txt || true
          git commit -m "auto: update laporan riset harian" || echo "Tidak ada perubahan file untuk di-commit"
          git push
